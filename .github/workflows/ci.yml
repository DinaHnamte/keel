name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Packages the desktop crate (Tauri, keychain via D-Bus) needs on Linux.
  LINUX_DESKTOP_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
    librsvg2-dev libdbus-1-dev libssl-dev patchelf

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of package names, split on purpose
          sudo apt-get install -y $LINUX_DESKTOP_DEPS
      - name: shellcheck
        run: shellcheck scripts/install.sh ci/onboarding.sh
      - name: install.sh unit file matches crates/keel-agent/dist/keel-agent.service
        run: |
          sed -n "/<<'UNIT'/,/^UNIT\$/p" scripts/install.sh | sed '1d;$d' > "$RUNNER_TEMP/unit"
          diff -u crates/keel-agent/dist/keel-agent.service "$RUNNER_TEMP/unit"
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci
      # Tauri's build embeds the frontend, so it must exist before cargo runs.
      - name: Build the frontend
        working-directory: apps/desktop
        run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: npm test
        working-directory: apps/desktop
        run: npm test

  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Agent idle RSS under 25 MB
        run: cargo test -p keel-agent --release --test memory

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz the frame decoder for 60 seconds
        working-directory: crates/keel-proto
        run: cargo +nightly fuzz run decode -- -max_total_time=60
      - name: Keep the crash input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/keel-proto/fuzz/artifacts/

  build-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml, includes both musl targets)
        run: rustup toolchain install
      # Tag builds start from a clean target dir: nothing restored from branch
      # runs is in the build that the release key later signs.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: agent-${{ matrix.arch }}
      - name: Install cargo-zigbuild
        run: |
          pip install ziglang==0.15.2
          cargo install cargo-zigbuild --version 0.23.4 --locked
      - name: Build a static musl agent
        run: cargo zigbuild -p keel-agent --release --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Collect
        run: |
          mkdir -p dist
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/keel-agent dist/keel-agent-${{ matrix.arch }}
          file dist/keel-agent-${{ matrix.arch }}
      # Build the signer with no secret in scope, so no build script or proc
      # macro of any dependency ever runs where the release key is readable.
      - name: Build the signing tool
        run: cargo build -p keel-client --example sign_agent
      - name: Sign with the dev key
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          target/debug/examples/sign_agent \
            crates/keel-client/dev-release.key \
            dist/keel-agent-${{ matrix.arch }} dist/keel-agent-${{ matrix.arch }}.sig
      - name: Sign with the release key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEEL_RELEASE_SIGNING_KEY: ${{ secrets.KEEL_RELEASE_SIGNING_KEY }}
          KEEL_RELEASE_PUBKEY: ${{ vars.KEEL_RELEASE_PUBKEY }}
        run: |
          if [ -z "$KEEL_RELEASE_SIGNING_KEY" ] || [ -z "$KEEL_RELEASE_PUBKEY" ]; then
            echo "::error::KEEL_RELEASE_SIGNING_KEY (secret) and KEEL_RELEASE_PUBKEY (variable) must be set to build a release."
            exit 1
          fi
          key="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key"' EXIT
          ( umask 077; printf '%s\n' "$KEEL_RELEASE_SIGNING_KEY" > "$key" )
          unset KEEL_RELEASE_SIGNING_KEY
          # The prebuilt signer only; no cargo here.
          out="$(target/debug/examples/sign_agent \
            "$key" dist/keel-agent-${{ matrix.arch }} dist/keel-agent-${{ matrix.arch }}.sig)"
          # The signing key must belong to the public key the desktop embeds.
          case "$out" in
            *"public key $KEEL_RELEASE_PUBKEY)"*) ;;
            *) echo "::error::KEEL_RELEASE_SIGNING_KEY doesn't match KEEL_RELEASE_PUBKEY."; exit 1 ;;
          esac
      - name: Checksum
        working-directory: dist
        run: sha256sum keel-agent-${{ matrix.arch }} > keel-agent-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  onboarding-matrix:
    needs: build-agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "debian:13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: agent-x86_64
          path: agent
      # The tests run a debug build of keel-client, which trusts the dev key,
      # so sign the shipped musl binary with it here (the .sig is separate,
      # the binary under test is the release artifact itself).
      - name: Sign the agent with the dev key for the test build
        run: |
          cargo run -p keel-client --example sign_agent -- \
            crates/keel-client/dev-release.key agent/keel-agent-x86_64 agent/dev.sig
      - name: Onboard, restart the agent, and run install.sh on ${{ matrix.image }}
        run: ci/onboarding.sh "${{ matrix.image }}" agent/keel-agent-x86_64 agent/dev.sig

  build-desktop:
    needs: build-agent
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of package names, split on purpose
          sudo apt-get install -y $LINUX_DESKTOP_DEPS
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          merge-multiple: true
          path: dist
      - name: Bundle the signed agents
        run: |
          for arch in x86_64 aarch64; do
            cp "dist/keel-agent-$arch" "dist/keel-agent-$arch.sig" apps/desktop/src-tauri/agent/
          done
          ls -l apps/desktop/src-tauri/agent/
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci
      # Debug builds trust the dev key the agents above were signed with;
      # release builds refuse to compile without the real release public key.
      - name: Tauri build (dev key, unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps/desktop
        run: npm run tauri -- build --debug
      - name: Tauri build (release key, unsigned)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        env:
          KEEL_RELEASE_PUBKEY: ${{ vars.KEEL_RELEASE_PUBKEY }}
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/debug/bundle/
            target/release/bundle/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint-test, memory, fuzz-smoke, onboarding-matrix, build-agent, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          merge-multiple: true
          path: dist
      - name: Draft a release with the agents and install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh dist/
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes dist/*
