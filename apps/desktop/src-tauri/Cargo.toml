[package]
name = "keel-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "keel_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "keel-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keel-client = { path = "../../../crates/keel-client", features = ["os-keychain"] }
keel-proto = { path = "../../../crates/keel-proto" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt"] }
zeroize = "1"
gethostname = "1"
tracing = "0.1"
