[package]
name = "keel-client"
version.workspace = true
edition.workspace = true

[features]
# OS keychain via the keyring crate. Off by default (needs dbus dev libraries
# on Linux); the desktop app enables it.
os-keychain = ["dep:keyring"]

[dependencies]
keel-proto = { path = "../keel-proto" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror = "2"
zeroize = { version = "1", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "sync"] }
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
russh = { version = "0.64", default-features = false, features = ["ring"] }
anyhow = "1.0.104"
tracing = "0.1.44"
hex = "0.4.3"
ring = "0.17"
gethostname = "1"

[dev-dependencies]
keel-agent = { path = "../keel-agent" }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time", "sync"] }
tempfile = "3"
